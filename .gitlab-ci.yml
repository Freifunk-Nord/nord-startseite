image:
  name: ghcr.io/gohugoio/hugo:v0.169.0
  entrypoint: [""]

test:
  stage: test
  script:
  - hugo build --destination test
  artifacts:
    paths:
    - test
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
  - hugo build --destination public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
