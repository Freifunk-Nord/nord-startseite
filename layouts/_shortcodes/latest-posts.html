<div class="post-grid">
  {{- range first 4 (partial "posts.html" .) }}
  <article class="post-card">
    <p class="postdate">{{ .Date.Format "January 02, 2006" }}</p>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{- with .Params.teaser }}
    <p>{{ . }}</p>
    {{- end }}
  </article>
  {{- end }}
</div>
