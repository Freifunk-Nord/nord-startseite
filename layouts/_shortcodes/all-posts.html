<div class="post-list">
  {{- range partial "posts.html" . }}
  <article class="post-card">
    <p class="postdate">{{ .Date.Format "January 02, 2006" }}</p>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p>{{ partial "excerpt.html" . }}</p>
    <p class="more">mehr..</p>
  </article>
  {{- end }}
</div>
